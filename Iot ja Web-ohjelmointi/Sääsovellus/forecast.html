<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ennuste - Sääsovellus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <!-- Navigation -->
      <header>
        <nav class="navbar">
          <div class="nav-brand">Sääsovellus</div>
          <ul class="nav-links">
            <li><a href="index.html">Etusivu</a></li>
            <li><a href="forecast.html" class="active">Ennuste</a></li>
            <li><a href="about.html">Tietoa</a></li>
          </ul>
        </nav>
      </header>

      <!-- Content -->
      <section class="app-content">
        <section class="weather-card" aria-label="Weather card">
          <form
            id="search-form"
            class="search"
            role="search"
            aria-label="Hae kaupunki"
          >
            <label class="sr-only" for="city-input">Kaupunki</label>
            <input id="city-input" type="text" placeholder="Hae kaupunki..." />
            <button id="search-button" type="submit">Hae</button>
          </form>

          <div class="weather-footer">
            <div class="info">Päivitetty: —</div>
            <div class="attribution">Säädata: paikallinen API</div>
          </div>
        </section>

        <section>
          <canvas id="weather-chart"></canvas>
        </section>

        <p class="note">
          Tämä on ennuste-sivu, joka näyttää sääennusteen grafiikassa.
        </p>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <span>☁️ Sääsovellus</span>
        <span>Sääsivu (© Diar M.)</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script-forecast.js"></script>
  </body>
</html>
